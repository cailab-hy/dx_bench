# ACT on the BED-03 near oracle demos v3 (D-45/46/47 cloth: air-drag damping, bending, 0.5 cm thickness; pad grasp)
name: act_bed03_v3_near
policy: dxbench.policies.rby1_lerobot_remote.Rby1LerobotRemotePolicy
policy_kw: {remote_port: 8788, open_loop_horizon: 8}
env_args: [--embodiment, rby1_joint]
tasks: {BED-03: [near]}
scenes_dir: benchmarks/dx_bed_v0/scenes
server: ~/miniforge3/envs/dx_policy/bin/python -m dxbench_policy.serve.server --backend lerobot --checkpoint outputs/train/act_bed03_v3_near/checkpoints/last/pretrained_model --chunk 8 --port 8788
video: true   # ACT needs the camera images (also writes the mp4s)
timeout_s: 7200
parallel: 3
max_steps: 1800   # 120 s sim cap; near oracle episodes take ~1350 steps
