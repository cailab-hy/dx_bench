# ACT 100k steps on the BED-03 easy oracle demos v2 (2.5 cm grasp, towel E 1e5, D-U10)
name: act_bed03_v2
policy: dxbench.policies.rby1_lerobot_remote.Rby1LerobotRemotePolicy
policy_kw: {remote_port: 8786, open_loop_horizon: 8}
env_args: [--embodiment, rby1_joint]
tasks: {BED-03: [easy]}
scenes_dir: benchmarks/dx_bed_v0/scenes
server: ~/miniforge3/envs/dx_policy/bin/python -m dxbench_policy.serve.server --backend lerobot --checkpoint outputs/train/act_bed03_v2/checkpoints/last/pretrained_model --chunk 8 --port 8786
video: true   # ACT needs the camera images (also writes the mp4s)
timeout_s: 7200
parallel: 3
max_steps: 1800   # 120 s sim cap (compute; oracle demos took 1340-1567 steps for two garments) - DECISIONS D-23
