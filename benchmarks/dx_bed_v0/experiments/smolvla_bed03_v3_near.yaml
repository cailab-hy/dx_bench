# SmolVLA (lerobot/smolvla_base) fine-tuned on the BED-03 near oracle demos v3 (D-45/46/47 cloth), D-49
name: smolvla_bed03_v3_near
policy: dxbench.policies.rby1_lerobot_remote.Rby1LerobotRemotePolicy
policy_kw: {remote_port: 8790, open_loop_horizon: 10}
env_args: [--embodiment, rby1_joint]
tasks: {BED-03: [near]}
scenes_dir: benchmarks/dx_bed_v0/scenes
server: ~/miniforge3/envs/dx_policy/bin/python -m dxbench_policy.serve.server --backend lerobot --checkpoint outputs/train/smolvla_bed03_v3_near/checkpoints/last/pretrained_model --chunk 10 --port 8790
video: true   # the policy needs the camera images (also writes the mp4s)
timeout_s: 7200
parallel: 3
max_steps: 1800   # 120 s sim cap (compute; oracle demos took 1340-1567 steps for two garments) - DECISIONS D-23
